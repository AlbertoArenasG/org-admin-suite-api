name: Deploy to Elastic Beanstalk

on:
  push:
    branches:
      - main
      - develop

env:
  AWS_REGION: ${{ secrets.AWS_REGION }}
  APPLICATION_NAME: icsacv-api
  ENVIRONMENT_NAME_DEV: Icsacv-api-dev
  ENVIRONMENT_NAME_PROD: Icsacv-api-prod
  S3_BUCKET_NAME: ${{ secrets.S3_BUCKET_NAME }}

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install dependencies
        run: npm ci

      - name: Build NestJS application
        run: npm run build

      - name: Generate deployment package
        run: zip -r deploy.zip . -x "*.git*" "node_modules/*" # Exclude unnecessary files

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }} # Your AWS region

      - name: Deploy to Elastic Beanstalk
        uses: einaregilsson/beanstalk-deploy@v21
        with:
          application_name: ${{ env.APPLICATION_NAME }} # Your Elastic Beanstalk application name
          environment_name: ${{ env.ENV_NAME }} # Your Elastic Beanstalk environment name
          version_label: ${{ github.sha }}
          region: ${{ env.AWS_REGION }} # Your AWS region
          deployment_package: deploy.zip
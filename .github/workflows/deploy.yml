name: Deploy to Elastic Beanstalk

on:
  push:
    branches:
      - develop

env:
  AWS_REGION: ${{ secrets.AWS_REGION }}
  APPLICATION_NAME: icsacv-api
  ENVIRONMENT_NAME: Icsacv-api-dev

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Use Node 22
        uses: actions/setup-node@v4
        with:
          node-version: '22.x'

      - name: Install deps (with dev)
        run: npm ci

      - name: Build NestJS
        run: npm run build

      - name: Prune dev deps (keep runtime only)
        run: npm prune --omit=dev

      - name: Prepare bundle
        run: |
          mkdir -p bundle
          cp -r dist package.json package-lock.json Procfile bundle/
          # Instalar solo deps de runtime dentro del bundle
          pushd bundle
          npm ci --omit=dev
          popd
          cd bundle && zip -r ../app.zip . && cd ..

      - name: Deploy to Elastic Beanstalk
        uses: einaregilsson/beanstalk-deploy@v22
        with:
          aws_access_key: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws_secret_key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          application_name: ${{ env.APPLICATION_NAME }}
          environment_name: ${{ env.ENVIRONMENT_NAME }}
          region: ${{ env.AWS_REGION }}
          version_label: v-${{ github.run_number }}-${{ github.sha }}
          deployment_package: app.zip
